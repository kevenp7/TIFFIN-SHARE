<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orders — TIFFIN SHARE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/jpeg" href="fav.jpg" />
</head>
<body class="customer-page">
  <header class="site-header modern">
    <div class="brand">
      <h1>TIFFIN SHARE</h1>
      <p class="tag">Orders</p>
    </div>
    <button class="mobile-menu-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav">
      <a href="index.html" data-i18n="home">Home</a>
      <a href="about.html" data-i18n="about">How it Works</a>
    </nav>
    <div class="lang-selector">
      <select id="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
        <option value="gu">ગુજરાતી</option>
      </select>
    </div>
  </header>

  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>
  <aside class="mobile-nav-panel" id="mobile-nav-panel" aria-label="Mobile navigation">
    <div class="mobile-nav-header">
      <span>Menu</span>
      <button class="mobile-nav-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="mobile-nav">
      <a href="index.html" data-i18n="home">Home</a>
      <a href="about.html" data-i18n="about">How it Works</a>
    </nav>
    <div class="mobile-lang-wrap">
      <label>Language</label>
      <select id="mobile-lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
        <option value="gu">ગુજરાતી</option>
      </select>
    </div>
  </aside>

  <main class="container">
    <section class="card">
      <h2 data-i18n="placedOrders">Placed Orders</h2>
      <div id="orders-list">
        <!-- orders injected by js/orders.js -->
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="copyright">&copy; TIFFIN SHARE</p>
  </footer>
</footer>

  <div id="toast" class="toast hidden"></div>

  <div id="confirm-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <p id="confirm-message">Are you sure?</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn small" data-i18n="no">No</button>
        <button id="confirm-ok" class="btn small danger" data-i18n="yes">Yes</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="i18n.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
  <script src="orders.js"></script>
</body>
</html>
